[package]
name = "mltk-rust"
version = "0.12.4"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "_mltk_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
# extension-module is injected by maturin at wheel-build time
# (pyproject.toml [tool.maturin] features) -- keeping it out of the
# default features lets `cargo test`/`cargo clippy` link libpython
# normally, instead of producing test binaries that cannot resolve
# Python symbols (STATUS_DLL_NOT_FOUND on Windows, link errors on Linux).
pyo3 = { version = "0.29" }
regex = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "drift"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
