name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # ruff format is not adopted repo-wide (395/546 files diverge); style
      # enforcement is `ruff check` only, matching the documented convention.
      - run: ruff check src/ tests/

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # sklearn is required at collection time by tests/test_scan/conftest.py;
      # cli (typer) and server (fastapi) are imported bare at module level by
      # tests/test_cli/test_container.py, tests/test_server/*, and others.
      - run: pip install -e ".[dev,scipy,sklearn,importer,cli,server]"
      # No coverage fail-under gate yet: the threshold has never been
      # calibrated against this (optional-deps-subset) CI environment.
      - run: pytest --cov=mltk --cov-report=xml -q

  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - run: cd rust && cargo fmt --check
      - run: cd rust && cargo clippy -- -D warnings
      - run: cd rust && cargo test

  docs-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # --skip-test-count: the collected-test total depends on which optional
      # extras are installed; it is kept fresh by the local pre-commit hook.
      # CI verifies the environment-independent AST-based counts only.
      - run: python scripts/bump.py verify --skip-test-count

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable

      - name: Python dependency audit
        run: pip install pip-audit && pip-audit --strict

      - name: Rust dependency audit
        working-directory: rust
        run: cargo install cargo-audit && cargo audit
