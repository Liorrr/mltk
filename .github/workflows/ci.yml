name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

# Keep branch preflight and PR merge-result evidence separate. Cancel obsolete
# attempts for the same branch/event, while preserving master runs.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ruff format is not adopted repo-wide (395/546 files diverge); style
      # enforcement is `ruff check` only, matching the documented convention.
      - run: python scripts/preflight.py job lint --install

  # Fast claim-integrity canary. Complements (does not replace) the full
  # OS×Python test matrix below. Agents use the same suite as their "done" gate.
  claim-regression:
    name: claim-regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Canary deps must stay inside `[dev]` (numpy/pandas/pytest only) — this
      # job installs no optional extras, unlike the `test` matrix below. A
      # canary importing typer/sklearn/fastapi/Pillow passes locally (dev envs
      # have the extras) and fails here at collection. Widen this install if
      # that ever becomes intended.
      - run: python scripts/preflight.py job claim-regression --install

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # sklearn is required at collection time by tests/test_scan/conftest.py;
      # cli (typer) and server (fastapi) are imported bare at module level by
      # tests/test_cli/test_container.py, tests/test_server/*, and others;
      # report (jinja2/plotly) and multimodal (Pillow/scikit-image) back
      # tests that hard-fail (not skip) when those deps are absent.
      # The onnx extra (onnxruntime) backs the ONNX tests; the separate `onnx`
      # package is installed only so tests can build small models.
      # Shared console-pytest entry point, collection check, 60% coverage gate,
      # and scripts/tests. The local preflight executes the same commands.
      - run: python scripts/preflight.py job test --install

  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/preflight.py job rust

  docs-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # --skip-test-count: the collected-test total depends on which optional
      # extras are installed; it is kept fresh by the local pre-commit hook.
      # CI verifies the environment-independent AST-based counts only.
      - run: python scripts/preflight.py job docs-freshness --install

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable

      - name: Python dependency audit
        run: pip install pip-audit && pip-audit --strict

      - name: Rust dependency audit
        working-directory: rust
        run: cargo install cargo-audit && cargo audit
